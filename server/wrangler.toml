name = "squeek-orbit"
main = "worker.js"
compatibility_date = "2026-11-01"

# Records every on-chain round settlement so results survive the API's 10-item window.
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "squeek-orbit"
database_id = "663f060e-eab5-4ca1-a64d-68cda6aef122"

[vars]
# Comma-separated origins allowed to write (runs, cheers, votes). Reads are open to everyone.
ALLOWED_ORIGINS = "https://orbit.kadaferhidup.my.id,https://kadaferhidup.github.io,http://localhost:8000"
